name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  windows-msys:
    name: Release Windows-${{ matrix.cc }} ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64]
        cc: [gcc]
        include:
          - arch: x86
            msystem: MINGW32
            prefix: mingw-w64-i686

          - arch: x86_64
            msystem: MINGW64
            prefix: mingw-w64-x86_64

    defaults:
      run:
        shell: msys2 {0}

    steps:

    - uses: msys2/setup-msys2@v2
      with:
        install: base-devel ${{ matrix.prefix }}-binutils ${{ matrix.prefix }}-make ${{ matrix.prefix }}-${{ matrix.cc }}
        msystem: ${{ matrix.msystem }}
        path-type: minimal
        release: false
        update: false
        cache: false

    - uses: actions/checkout@v6
      with:
        submodules: recursive


    - name: Build
      run: |
        make install -j$(nproc) ARCH=${{ matrix.arch }} COMPILE_ARCH=${{ matrix.arch }} CC=${{ matrix.cc }} DESTDIR=bin

    - uses: actions/upload-artifact@v7
      with:
        name: windows-${{ matrix.cc }}-${{ matrix.arch }}
        path: bin
        if-no-files-found: error
        retention-days: 5

  windows-msys32:
    name: Release Windows-msys32 ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64]

    steps:
    - name: Checkout current repo
      uses: actions/checkout@v6

    - name: Checkout msys32 tools from sibling repo
      uses: actions/checkout@v6
      with:
        repository: ec-/msys32
        path: msys

    - name: Extract msys32.7z
      run: |
        7z x %GITHUB_WORKSPACE%/msys/msys32.7z -o%GITHUB_WORKSPACE%/msys
      shell: cmd

    - name: Prepend msys/bin to PATH
      run: |
           echo "PATH=$GITHUB_WORKSPACE/msys/mingw/bin;$GITHUB_WORKSPACE/msys/bin;$GITHUB_WORKSPACE/msys" >> $GITHUB_ENV
      shell: bash

    - name: Build
      shell: cmd
      run: |
        make install ARCH=${{ matrix.arch }} DESTDIR=bin

    - uses: actions/upload-artifact@v7
      with:
        name: windows-mingw-${{ matrix.arch }}
        path: bin
        if-no-files-found: error
        retention-days: 5

  windows-msvc:
    name: Release Windows-MSVC arm64
    runs-on: windows-2022

    steps:

    - uses: microsoft/setup-msbuild@v2

    - uses: actions/checkout@v6
      with:
        submodules: recursive


    - name: Build
      run: |
        mkdir bin

        $version = git describe --tags --always --dirty
        $env:CL = "/DTRINITY_ENGINE_VERSION=\`"$version\`""

        msbuild code\win32\msvc2017\trinity-ded.vcxproj -p:TargetName=trinity.ded,Configuration=Release,Platform=ARM64 /p:PlatformToolset=v143
        copy code\win32\msvc2017\output\trinity.ded.exe bin\trinity.ded.exe

        msbuild code\win32\msvc2017\renderer.vcxproj -p:Configuration=Release,Platform=ARM64 /p:PlatformToolset=v143
        copy code\win32\msvc2017\output\trinity_opengl_arm64.dll bin\

        msbuild code\win32\msvc2017\renderervk.vcxproj -p:Configuration=Release,Platform=ARM64 /p:PlatformToolset=v143
        copy code\win32\msvc2017\output\trinity_vulkan_arm64.dll bin\

        msbuild code\win32\msvc2017\trinity.vcxproj -p:TargetName=trinity,Configuration=Release,Platform=ARM64,UseWasapi=USE_WASAPI=0 /p:PlatformToolset=v143
        copy code\win32\msvc2017\output\trinity.exe bin\trinity.exe

    - uses: actions/upload-artifact@v7
      with:
        name: windows-msvc-arm64
        path: bin
        if-no-files-found: error
        retention-days: 5

  ubuntu-x86:
    name: Release Ubuntu ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x86_64]
        cc: [gcc]
        include:
          - arch: x86
            use_sdl: USE_SDL=0
            use_voip: USE_VOIP=0

          - arch: x86_64
            use_sdl: USE_SDL=1
            use_voip: USE_VOIP=1

    steps:

    - name: Install tools
      run: |
        if [ ${{ matrix.arch }} == "x86" ]; then
          sudo dpkg --add-architecture i386
          sudo apt-get -qq update
          sudo apt-get -y install gcc-multilib libcurl4-openssl-dev:i386 mesa-common-dev:i386 libxxf86dga-dev:i386 libxrandr-dev:i386 libxxf86vm-dev:i386 libasound-dev:i386
        else
          sudo apt-get -qq update
          sudo apt-get -y install libcurl4-openssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev
        fi

    - uses: actions/checkout@v6
      with:
        submodules: recursive


    - name: Build
      run: |
        make install -j$(nproc) ARCH=${{ matrix.arch }} COMPILE_ARCH=${{ matrix.arch }} CC=${{ matrix.cc }} DESTDIR=bin ${{ matrix.use_sdl }} ${{ matrix.use_voip }}

    - uses: actions/upload-artifact@v7
      with:
        name: linux-${{ matrix.arch }}
        path: bin
        if-no-files-found: error
        retention-days: 5

  ubuntu-arm64:
    name: Release Ubuntu arm64
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        cc: [gcc]

    steps:

    - name: Install tools
      run: |
        sudo apt-get -qq update
        sudo apt-get install -y make gcc g++
        sudo apt-get -y install libcurl4-openssl-dev mesa-common-dev libxxf86dga-dev libxrandr-dev libxxf86vm-dev libasound-dev libsdl2-dev

    - uses: actions/checkout@v6
      with:
        submodules: recursive


    - name: Build
      run: |
          make install -j$(nproc) ARCH=${{ matrix.arch }} CC=${{ matrix.cc }} DESTDIR=bin

    - uses: actions/upload-artifact@v7
      with:
        name: linux-${{ matrix.arch }}
        path: bin
        if-no-files-found: error
        retention-days: 5

  build-armv7:
    name: Release Linux armv7
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
  

      - name: Install cross-compiler
        run: |
          sudo dpkg --add-architecture armhf
          sudo sed -i 's/^Types:/Architectures: amd64\nTypes:/' /etc/apt/sources.list.d/ubuntu.sources
          sudo sh -c 'cat > /etc/apt/sources.list.d/armhf-ports.list <<EOF
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports noble-security main universe
          EOF'
          sudo apt-get -qq update
          sudo apt-get -y install gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libcurl4-openssl-dev:armhf mesa-common-dev:armhf libxxf86dga-dev:armhf libxrandr-dev:armhf libxxf86vm-dev:armhf libasound-dev:armhf

      - name: Build
        run: make install -j$(nproc) ARCH=arm CC=arm-linux-gnueabihf-gcc STRIP=arm-linux-gnueabihf-strip DESTDIR=bin USE_SDL=0 USE_VOIP=0

      - uses: actions/upload-artifact@v7
        with:
          name: linux-armv7
          path: bin
          if-no-files-found: error
          retention-days: 5

  macos:
    name: Release macOS universal2
    runs-on: macos-14
    environment: release

    steps:

    - name: Install tools
      run: brew install coreutils sdl2 # pkg-config

    - uses: actions/checkout@v6
      with:
        submodules: recursive


    - name: Download Trinity mod paks
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p trinity-assets
        gh release download --repo ernie/trinity --pattern 'pak8t.pk3'                --dir trinity-assets
        gh release download --repo ernie/trinity --pattern 'pak3t.pk3'                --dir trinity-assets
        gh release download --repo ernie/trinity --pattern 'zzz-trinity-announcer.pk3' --dir trinity-assets

    - name: Build universal2 app bundle (with mod paks bundled)
      env:
        TRINITY_ASSETS_DIR: ${{ github.workspace }}/trinity-assets
      run: |
        NCPU=$(sysctl -n hw.logicalcpu)
        make -j$NCPU PLATFORM=darwin ARCH=x86_64  CC=clang USE_RENDERER_DLOPEN=0 STRIP=echo
        make -j$NCPU PLATFORM=darwin ARCH=aarch64 CC=clang USE_RENDERER_DLOPEN=0 STRIP=echo
        chmod +x make-macosx-app.sh
        ./make-macosx-app.sh release
        mkdir -p bin
        cp -R build/release-darwin-universal2/Trinity.app bin/

    - name: Sign and notarize app bundle
      env:
        MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
        AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
      run: |
        set -euo pipefail

        if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ]; then
          echo "::warning::Signing secrets not configured; shipping ad-hoc signed build."
          echo "Set MACOS_CERTIFICATE_BASE64 (and friends) in repo secrets to enable signing."
          exit 0
        fi

        # Stage credentials in $RUNNER_TEMP (auto-cleaned by GitHub).
        CERT_PATH="$RUNNER_TEMP/cert.p12"
        API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
        echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
        echo "$AC_API_KEY_BASE64"        | base64 --decode > "$API_KEY_PATH"
        chmod 600 "$CERT_PATH" "$API_KEY_PATH"

        # Build a throwaway keychain so we never touch the runner's login.keychain.
        KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
        KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
        security create-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 21600 "$KEYCHAIN"
        security unlock-keychain  -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

        security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
          -A -t cert -f pkcs12 -k "$KEYCHAIN"

        # Make the new keychain searchable by codesign without ejecting the default.
        security list-keychains -d user -s "$KEYCHAIN" \
          $(security list-keychains -d user | sed -e 's/[\" ]//g')

        # Allow codesign to use the imported key without an interactive prompt.
        security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

        export AC_API_KEY_PATH="$API_KEY_PATH"
        chmod +x misc/macos-codesign.sh
        ./misc/macos-codesign.sh bin/Trinity.app

    - name: Build DMG
      run: |
        # Pack the signed/notarized .app into a drag-to-Applications DMG.
        # The .app is already notarized and stapled; we don't notarize the
        # DMG too — Gatekeeper checks the inner .app on first launch.
        chmod +x misc/macos-make-dmg.sh
        ./misc/macos-make-dmg.sh bin/Trinity.app trinity-macos-universal2.dmg

    - name: Archive with ditto (preserves stapled ticket)
      run: |
        # ditto preserves extended attributes — including the notarization
        # staple — and macOS metadata that plain zip/tar strip. Without this,
        # Gatekeeper has to make a network round-trip to Apple on first
        # launch instead of trusting the local staple.
        mv bin macos-universal2
        ditto -c -k --sequesterRsrc --keepParent macos-universal2 trinity-macos-universal2.zip

    - name: Clean up signing keychain
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"

    - uses: actions/upload-artifact@v7
      with:
        name: macos-universal2
        path: |
          trinity-macos-universal2.zip
          trinity-macos-universal2.dmg
        if-no-files-found: error
        retention-days: 5

  web:
    name: Release Web
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v6
      with:
        submodules: recursive


    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 5.0.1

    - name: Build web engine
      run: make web

    - uses: actions/upload-artifact@v7
      with:
        name: web-engine
        path: dist/engine
        if-no-files-found: error
        retention-days: 5

  release:
    needs: [windows-msys, windows-msys32, windows-msvc, ubuntu-x86, ubuntu-arm64, build-armv7, macos, web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            misc/update-trinity.bat
            misc/update-trinity.sh

      - name: Download build artifacts
        uses: actions/download-artifact@v8

      - name: Stage pre-built macOS artifacts
        # The macOS bundle is signed, notarized, stapled, and zipped with
        # ditto on the macOS runner — moving them to the top level lets the
        # checksum and release steps treat them like every other zip without
        # the Linux runner ever touching xattrs or the DMG structure.
        run: |
          mv macos-universal2/trinity-macos-universal2.zip .
          mv macos-universal2/trinity-macos-universal2.dmg .

      - name: Download Trinity assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p trinity-assets
          gh release download --repo ernie/trinity --pattern 'pak8t.pk3' --dir trinity-assets
          gh release download --repo ernie/trinity --pattern 'pak3t.pk3' --dir trinity-assets
          gh release download --repo ernie/trinity --pattern 'zzz-trinity-announcer.pk3' --dir trinity-assets

      - name: Bundle game data into platform artifacts
        run: |
          PLATFORM_DIRS=(
            linux-x86
            linux-x86_64
            linux-arm64
            linux-armv7
            windows-mingw-x86
            windows-mingw-x86_64
            windows-msvc-arm64
          )

          for dir in "${PLATFORM_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              echo "Bundling game data into $dir/"

              # Trinity assets → baseq3/ and missionpack/
              mkdir -p "$dir/baseq3" "$dir/missionpack"
              cp trinity-assets/pak8t.pk3 "$dir/baseq3/"
              cp trinity-assets/pak3t.pk3 "$dir/missionpack/"
              cp trinity-assets/zzz-trinity-announcer.pk3 "$dir/baseq3/"
            else
              echo "Warning: $dir not found, skipping"
            fi
          done

      - name: Bundle update scripts
        run: |
          for dir in windows-mingw-x86 windows-mingw-x86_64 windows-msvc-arm64; do
            [ -d "$dir" ] && cp misc/update-trinity.bat "$dir/"
          done
          for dir in linux-x86 linux-x86_64 linux-arm64 linux-armv7; do
            [ -d "$dir" ] && cp misc/update-trinity.sh "$dir/"
          done

      - name: Restore executable permissions
        run: |
          for dir in linux-x86 linux-x86_64 linux-arm64 linux-armv7; do
            [ -d "$dir" ] && chmod +x "$dir"/trinity "$dir"/trinity.ded 2>/dev/null || true
          done

      - name: Create binary archives
        run: |
          zip -r -y trinity-linux-x86.zip            ./linux-x86/
          zip -r -y trinity-linux-x86_64.zip         ./linux-x86_64/
          zip -r -y trinity-linux-arm64.zip          ./linux-arm64/
          zip -r -y trinity-linux-armv7.zip          ./linux-armv7/
          7z a -r trinity-windows-mingw-x86.zip    ./windows-mingw-x86/*
          7z a -r trinity-windows-mingw-x86_64.zip ./windows-mingw-x86_64/*
          7z a -r trinity-windows-msvc-arm64.zip   ./windows-msvc-arm64/*
          7z a -r trinity-web-engine.zip           ./web-engine/*

      - name: Generate checksums
        run: |
          set -euxo pipefail
          sha256sum trinity-*.zip trinity-*.dmg > sha256sums.txt
          cat sha256sums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.dmg
            sha256sums.txt
