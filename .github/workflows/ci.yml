name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -y install build-essential libcurl4-openssl-dev libsdl2-dev libx11-dev

      - name: Build
        run: make -j$(nproc)

  build-macos:
    # Mirrors the pre-signing steps of the release workflow's macos job so
    # PRs catch anything that would break a tag-triggered release: per-arch
    # builds, the universal2 lipo merge in make-macosx-app.sh, and the
    # ad-hoc signature the script applies. The Developer ID signing and
    # notarization steps stay release-only — they need secrets, cost
    # Apple notary submissions, and aren't catchable here anyway.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install coreutils sdl2

      - name: Build universal2 app bundle
        run: |
          NCPU=$(sysctl -n hw.logicalcpu)
          make -j$NCPU PLATFORM=darwin ARCH=x86_64  CC=clang USE_RENDERER_DLOPEN=0 STRIP=echo
          make -j$NCPU PLATFORM=darwin ARCH=aarch64 CC=clang USE_RENDERER_DLOPEN=0 STRIP=echo
          chmod +x make-macosx-app.sh
          ./make-macosx-app.sh release

      - name: Verify bundle signature
        # make-macosx-app.sh ad-hoc signs the bundle. If that signature is
        # malformed (missing nested binary, broken Mach-O, etc.) the real
        # Developer ID signing at release time will also fail — catching
        # it here saves a tag-then-rollback cycle.
        run: |
          codesign --verify --deep --strict --verbose=2 \
            build/release-darwin-universal2/Trinity.app
