name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -y install build-essential libcurl4-openssl-dev libsdl2-dev libx11-dev

      - name: Build
        run: make -j$(nproc)

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install coreutils sdl2

      - name: Build
        run: make -j$(sysctl -n hw.logicalcpu) CC=clang STRIP=echo
