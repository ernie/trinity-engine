// VR bindings: every controller input is a key named VR_<input>.
// bind VR_<key> "<command>" sets gameplay; vrbind <context> VR_<key> "<command>" sets the other contexts
// (global, menu, adjust, scrub, scoreboard, vote, wheel, follow), and <context>+alt sets what a button does with Alt held.
// vrbindlist shows the current bindings; vr_bindreset restores this controller's defaults.
// Remove the "//" in front of a line to use it.

// bind VR_DPAD_UP "messagemode"
// vrbind gameplay+alt VR_A "say gg"
// vrbind global VR_OFF_THUMBREST "weapon_adjust"
